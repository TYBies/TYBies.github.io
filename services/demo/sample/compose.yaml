services:
  app:
    build: .
    environment:
      APP_VERSION: ${APP_VERSION:-v1}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['status']=='ok'"]
      interval: 2s
      timeout: 2s
      retries: 10
